<!DOCTYPE html>
<html lang="hu">
<head>
    <link rel="icon" type="image/png" href="images/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>GyManager</title>
</head>
<body>

    <!-- FELSŐ INTERAKTÍV MENÜ -->
    <header class="navbar">
        <div class="nav-container">
            <!-- Javított, nyújtott logó konténer -->
            <div class="nav-logo">
                <img src="images/logo.png" alt="GyManager Logo">
            </div>
            
            <!-- Navigációs menüpontok -->
            <nav class="nav-links">
                <a href="#" class="nav-link active">Home</a>
                <a href="#" class="nav-link">Classes</a>
                <a href="#" class="nav-link">Services</a>
                <a href="#" class="nav-link">Pages</a>
                <a href="#" class="nav-link">Blog</a>
                <a href="#" class="nav-link">Contact</a>
            </nav>

            <!-- Jobb oldali akció gomb -->
            <div class="nav-actions">
                <a href="#" class="btn-join">Join Us Today</a>
            </div>
        </div>
    </header>

    <!-- FŐ TARTALOM -->
    <main class="container">
        <div style="padding: 120px 0; text-align: center;">
            <h1 style="font-size: 3.5rem; margin-bottom: 20px;">OBTAIN YOUR GOALS</h1>
            <p style="color: var(--text-muted); max-width: 600px; margin: 0 auto;">Kezeld az edzéseket, kísérd figyelemmel a tagok fejlődését egyetlen modern, professzionális platformon.</p>
        </div>
    </main>

</body>
</html>
